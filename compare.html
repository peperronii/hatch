<!DOCTYPE html>
<head>
	<script src="hatch.js"></script>
</head>
<body>
	<div id="root"></div>
	<template>
		<table>
			<tr hh-for="i:0..name-1">
				<td hh:="name[i]"></td>
				<td hh:="calories[i]"></td>
			</tr>
		</table>
	</template>
	<form onsubmit="
		let root = document.querySelector('#root');
		let temp = document.querySelector('template');
		root.append(hatch.html(temp, new FormData(this)));
		return false;
		">
		<input name="name" value="Toast" />
		<input name="calories" value="1499" />

		<input name="name" value="Bacon" />
		<input name="calories" value="3245" />

		<input name="name" value="Coffee" />
		<input name="calories" value="300" />
		<button>submit</button>
	</form>
</body>
